server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # The page only loads its own scripts and styles, and talks only to its own origin.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Same origin as the page, so the API needs no CORS.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    client_max_body_size 64k;
  }

  location / {
    try_files $uri /index.html;
  }
}
